<style>
  :root{--ink:#18203a;--mute:#5f6880;--line:#dfe3ec;--bg:#f3f5fa;--card:#fff;--acc:#15224d;--acc2:#2b4fb8;--ok:#15805a;--warn:#9a4d07;--soft:#eef2fb}

  header{background:linear-gradient(135deg,#15224d 0%,#24408f 100%);color:#fff;padding:20px 18px 26px}

  .progress{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.08)}

  #toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#18203a;color:#fff;padding:12px 16px;border-radius:12px;max-width:92%;z-index:9;font-size:15px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}

</style>

<body>
<header><div class="in">
  <div class="kicker" id="kick">קליטת עובד חדש</div>

<script>
"use strict";
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CPA_EMAIL = "cpa.snir@gmail.com";
const CPA_NAME = "משרד רו\"ח שניר טרמצ'י";
// כתובת ה-Web App של Google Apps Script (apps-script/Code.gs). ריק = שליחה דרך הטלפון.
const SEND_URL = "";
const DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toB64url(bytes){ let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function fromB64url(s){ s = s.replace(/[^A-Za-z0-9_\-]/g,"").replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; const bin = atob(s); const b = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i); return b; }
function b64urlEncode(obj){ return toB64url(new TextEncoder().encode(JSON.stringify(obj))); }
function b64urlDecode(s){ return JSON.parse(new TextDecoder().decode(fromB64url(s))); }
async function packLink(obj){
  const json = JSON.stringify(obj);
  if("CompressionStream" in window){
    try{
      const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
      return "#k=" + toB64url(new Uint8Array(buf));
    }catch(e){}
  }
  return "#e=" + b64urlEncode(obj);
}
async function unpackK(s){
  if(!("DecompressionStream" in window)) throw new Error("nodecomp");
  const txt = await new Response(new Blob([fromB64url(s)]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  return JSON.parse(txt);
}
function fmtDate(d){ if(!d) return ""; const [y,m,dd] = d.split("-"); return dd && m && y ? `${dd}/${m}/${y}` : d; }
function nowStamp(){ const d = new Date(); const o = {timeZone:"Asia/Jerusalem"}; return d.toLocaleDateString("en-GB",o) + " בשעה " + d.toLocaleTimeString("en-GB",Object.assign({hour:"2-digit",minute:"2-digit"},o)); }
function todayStr(){ return new Date().toLocaleDateString("he-IL",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",year:"numeric"}).replace(/\./g,"/"); }
function validId(id){
  id = String(id||"").trim(); if(!/^\d{5,9}$/.test(id)) return false;
  id = id.padStart(9,"0"); let sum = 0;
  for(let i=0;i<9;i++){ let n = Number(id[i]) * ((i%2)+1); sum += n>9 ? n-9 : n; }
  return sum % 10 === 0;
}
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 4200); }
function bad(id, msg){ const el = $("#"+id); if(el){ el.classList.add("bad"); el.scrollIntoView({behavior:"smooth",block:"center"}); el.addEventListener("input", () => el.classList.remove("bad"), {once:true}); el.addEventListener("change", () => el.classList.remove("bad"), {once:true}); } toast(msg); return false; }
function header(kick, h, sub){ $("#kick").textContent = kick; $("#hdr").textContent = h; $("#sub").textContent = sub; }
function progress(step, total, label){ return `<div class="progress"><div class="lbl"><b>${label}</b><span>שלב ${step} מתוך ${total}</span></div><div class="bar"><i style="width:${Math.round(step/total*100)}%"></i></div></div>`; }
function dock(html){ const d = $("#dock"); if(!html){ d.classList.add("hidden"); return; } $("#dockIn").innerHTML = html; d.classList.remove("hidden"); }
function radio(name, opts, val){ return `<div class="seg">${opts.map(([v,t]) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${v===val?"checked":""}>${t}</label>`).join("")}</div>`; }
const rv = name => (document.querySelector(`[name="${name}"]:checked`)||{}).value || "";
function taxYear(){ const y = T && T.start ? Number(String(T.start).slice(0,4)) : 0; const now = new Date().getFullYear(); return y && y >= now ? y : now; }

/* ================= signature pad ================= */
function sigPad(canvas){
  const ctx = canvas.getContext("2d"); let drawing = false, dirty = false, last = null, strokes = [], cur = null;
  const norm = p => { const r = canvas.getBoundingClientRect(); return [Math.round(p.x*400/r.width), Math.round(p.y*130/r.height)]; };
  function fit(){ const r = canvas.getBoundingClientRect(); const dpr = Math.max(1, window.devicePixelRatio||1);
    canvas.width = r.width*dpr; canvas.height = r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1b4a"; dirty = false; }
  fit();
  const pos = e => { const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  canvas.addEventListener("pointerdown", e => { drawing = true; last = pos(e); cur = [norm(last)]; strokes.push(cur); try{ canvas.setPointerCapture(e.pointerId); }catch(_){} });
  canvas.addEventListener("pointermove", e => { if(!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; dirty = true;
    const n = norm(p), q = cur[cur.length-1]; if(Math.abs(n[0]-q[0]) + Math.abs(n[1]-q[1]) >= 4) cur.push(n); });
  ["pointerup","pointercancel","pointerleave"].forEach(t => canvas.addEventListener(t, () => drawing = false));
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); dirty = false; strokes = []; },
    compact(){ return "s:" + strokes.filter(st => st.length).map(st => st.map(([x,y]) => x.toString(36)+"."+y.toString(36)).join(" ")).join("|"); },
    isEmpty(){ return !dirty; },
    data(){ const c = document.createElement("canvas"); c.width = 400; c.height = 130; const x = c.getContext("2d");
      x.drawImage(canvas,0,0,400,130); return c.toDataURL("image/png"); }
  };
}
function sigSrc(sig){
  if(!sig || sig.startsWith("data:")) return sig || "";
  const c = document.createElement("canvas"); c.width = 400; c.height = 130; const x = c.getContext("2d");
  x.strokeStyle = "#0b1b4a"; x.lineWidth = 2.6; x.lineCap = "round"; x.lineJoin = "round";
  sig.slice(2).split("|").forEach(st => { const pts = st.split(" ").map(p => p.split(".").map(v => parseInt(v,36)));
    x.beginPath(); pts.forEach(([a,b],i) => i ? x.lineTo(a,b) : x.moveTo(a,b)); if(pts.length===1) x.lineTo(pts[0][0]+1,pts[0][1]); x.stroke(); });
  return c.toDataURL("image/png");
}

/* ================= agreement ================= */
function wageLine(t){ return t.wageType === "monthly" ? `${esc(t.wage)} ₪ ברוטו לחודש` : `${esc(t.wage)} ₪ ברוטו לשעה`; }
function scheduleText(t){
  const rows = DAYS.map((d,i) => t.days && t.days[i] ? `<span class="dayc">יום ${d}: <b dir="ltr">${esc(t.days[i])}</b></span>` : "").join("");
  return rows ? `<p class="dayl">${rows}</p>` : "<p>לפי סידור עבודה שיימסר לעובד מראש.</p>";
}
function probationText(t){
  if(!t.probation) return "";
  const n = Number(t.probation);
  const words = {1:"החודש הראשון",2:"החודשיים הראשונים",3:"שלושת החודשים הראשונים",6:"ששת החודשים הראשונים"}[n] || `${n} החודשים הראשונים`;
  return ` ${words} להעסקה הם תקופת ניסיון.`;
}
const AGR_VER = "3.4 (11/2026)";
const LINK_VER = 5; // קישורים מגרסה קודמת לא נפתחים – המעסיק יוצר קישור חדש
function agreementBody(t, emp){
  const name = emp && emp.fullName ? esc(emp.fullName) : "<span style='color:#999'>(שם העובד)</span>";
  const id = emp && emp.idNum ? esc(emp.idNum) : "<span style='color:#999'>(ת\"ז)</span>";
  const addr = emp && emp.address ? esc(emp.address) : "";
  const boss = esc(t.manager || t.signer);
  const place = esc(t.workplace || t.address);
  const sev = Number(t.sevPct||6);
  const hourly = t.wageType !== "monthly";
  const plan = hoursPlan(t), pens = emp && emp.pens || "", pensFund = (emp && emp.pensFund) || t.pensionFund;
  const pAge = emp && emp.pensAge, pensAgeNote = pAge ? `לפי הצהרת העובד טרם מלאו לו ${pAge} שנים – גיל הזכאות לפי הצו; ההפרשות לא יחלו לפני הגיעו לגיל זה, אלא אם חלה עליו זכאות אחרת.` : "";
  let n = 0, m = 0;
  const H = title => { n++; m = 0; return `</div><div class="sec"><h4><span class="sn">${n}</span> ${title}</h4>`; };
  const P = (html, cond=true) => cond ? `<p>${n}.${++m} ${html}</p>` : "";
  return `
  <div class="parties">
    <div><small>המעסיק</small> <b>${esc(t.company)}</b>${t.companyId ? `<br>ח.פ/ע.מ ${esc(t.companyId)}` : ""}<br>${esc(t.address)}<br>(להלן: "המעסיק")</div>
    <div><small>העובד</small> <b>${name}</b><br>ת"ז ${id}${addr ? `<br>${addr}` : ""}<br>(להלן: "העובד")</div>
  </div>
  <p><b>הואיל</b> והמעסיק מעוניין להעסיק את העובד, והעובד מעוניין לעבוד אצל המעסיק, בתנאים המפורטים בהסכם זה;</p>

  <p><b>לפיכך הוסכם בין הצדדים כדלקמן:</b></p>
  <div>
  ${H("מבוא ופרשנות")}
  ${P("המבוא להסכם זה מהווה חלק בלתי נפרד ממנו. כותרות הסעיפים נועדו לנוחות בלבד. האמור בלשון זכר או נקבה – אחד הוא.")}
  ${P(`הסכם זה מהווה גם הודעה לעובד על תנאי עבודתו לפי חוק הודעה לעובד ולמועמד לעבודה (תנאי עבודה ומיון והליכי קבלה לעבודה), התשס"ב-2002. על יחסי העבודה יחולו, בנוסף להסכם, דיני העבודה וצווי ההרחבה הכלליים החלים על המעסיק.`)}
  ${P(t.collective ? `על העובד חל: <b>${esc(t.collective)}</b>, והוראותיו יחולו על יחסי העבודה. ארגון העובדים: ${esc(t.unionInfo||"")}.` : `לפי הצהרת המעסיק, נכון למועד החתימה הוא אינו חבר בארגון מעסיקים ולא חל על העובד הסכם קיבוצי.`)}
  ${P("אין באמור בסעיף זה כדי לגרוע מתחולתו של צו הרחבה, הסכם קיבוצי או הסדר אחר המחייבים את הצדדים לפי דין; ככל שחל הסדר כזה – יחולו הוראותיו, והזכויות לפיו יינתנו גם אם לא פורטו בהסכם.")}

  ${H("התפקיד, מקום העבודה וסמכויות ניהול")}
  ${P(`העובד יועסק בתפקיד <b>${esc(t.role)}</b>, ויבצע את המשימות הנובעות מהתפקיד לפי הוראות המעסיק והממונה הישיר – <b>${boss}</b>.`)}
  ${P(`מקום העבודה: <b>${place}</b>, או מקום אחר שיקבע המעסיק בהתאם לצורכי העבודה ובמסגרת הסבירות.`)}
  ${P("המעסיק רשאי לקבוע ולעדכן את סדרי העבודה, חלוקת המשימות, סידור המשמרות ונהלי העבודה לפי צורכי העסק, בכפוף לדין וללא הרעה בלתי כדין בתנאי ההעסקה. העובד יבצע גם משימות נלוות וסבירות התואמות את תפקידו וכישוריו.")}
  ${P("העובד יבצע את עבודתו במסירות, בנאמנות ובמיומנות, יקפיד על נהלי העבודה, הבטיחות והשירות שהובאו לידיעתו, ויודיע למעסיק ללא דיחוי על כל עניין שעלול להעמיד אותו בניגוד עניינים.")}

  ${H("תקופת ההעסקה" + (t.probation ? " ותקופת ניסיון" : ""))}

  ${P(`${probationText(t).trim().replace(/\.$/,"")} (להלן: "תקופת הניסיון"). אין בתקופת הניסיון התחייבות להעסקה למשך כל התקופה. במהלכה יבחנו הצדדים את ההתאמה לתפקיד, וסיום העסקה ייעשה בהודעה מוקדמת כדין ולאחר מתן זכות טיעון (שימוע).`, !!t.probation)}

  ${H("שעות עבודה, נוכחות ושעות נוספות")}
  ${P(`היקף המשרה: <b>${esc(t.weeklyHours)}</b> שעות עבודה בשבוע, בשבוע עבודה של <b>${plan.pattern} ימים</b>. יום עבודה רגיל: עד ${plan.pattern === "6" ? "8 שעות (7 שעות בערב יום המנוחה)" : `8:36 שעות, וביום ${DAYS[plan.shortDay]||"המקוצר"} (היום המקוצר) עד 7:36 שעות`}; יום שיש בו שעתיים לפחות בין 22:00 ל-06:00 – עד 7 שעות. שבוע עבודה רגיל: עד 42 שעות. יום המנוחה השבועי: <b>${esc(t.restDay||"שבת")}</b>.`)}
  ${P(`ימי העבודה ושעותיה:</p>${scheduleText(t)}<p style="display:none">`)}
  ${P(`הפסקות – לפי חוק שעות עבודה ומנוחה, התשי"א-1951: ${plan.brkDef ? `ביום עבודה של 6 שעות ומעלה תינתן הפסקה של ${plan.brkDef} דקות${plan.brkDef >= 30 ? ", מהן 30 דקות רצופות לפחות" : ""}${plan.rows.some(r => r && plan.sh[r.i].brk !== null) ? " (בימים שבהם נקבע אחרת בסידור – כמפורט בו)" : ""}. ` : ""}${t.breakPaid ? "העובד נדרש להישאר במקום העבודה במהלך ההפסקה, ולכן ההפסקה נחשבת חלק משעות העבודה ומשולמת." : "בהפסקה העובד רשאי לצאת ממקום העבודה, ולכן היא אינה חלק משעות העבודה ואינה משולמת. אם העובד יידרש להישאר במקום העבודה במהלכה – ההפסקה תיחשב שעות עבודה. הפסקה שלא ניתנה בפועל – לא תנוכה."}`)}
  ${P("העובד יתייצב לעבודה במועדים שנקבעו, ידווח באופן מלא ומדויק על שעות עבודתו במערכת הנוכחות שיקבע המעסיק, ויודיע בהקדם האפשרי על כל איחור או היעדרות. אסור לדווח נוכחות עבור עובד אחר או לשנות דיווח ללא אישור.")}
  ${P("עבודה בשעות נוספות תיעשה <b>רק לפי דרישת המעסיק או באישורו מראש</b>. ביצוע שעות נוספות ללא אישור עשוי להיחשב הפרת משמעת, אך אין בכך כדי לגרוע מזכות העובד לתשלום המגיע לו לפי דין. שעות נוספות הן שעות מעבר ליום העבודה הרגיל, או מעבר ל-42 שעות רגילות בשבוע (שעה לא תיספר פעמיים). גמול שעות נוספות ישולם לפי החוק: 125% מהשכר הרגיל בעד שתי השעות הנוספות הראשונות ביום, ו-150% בעד כל שעה נוספת שלאחריהן. עבודה ביום המנוחה תיעשה רק בהיתר ותשולם לפי החוק.")}
  ${P(`לפי סידור העבודה המתוכנן: ${fmtH(plan.regular)} שעות רגילות ו-${fmtH(plan.ot)} שעות נוספות בשבוע. השעות הנוספות ישולמו בגמול לפי החוק${hourly ? "" : ", בנוסף לשכר החודשי"}${t.globalOT ? ", ובכפוף לסעיף הגמול הגלובלי" : ""}.`, plan.ot > 0)}
  ${P(`גמול שעות נוספות גלובלי: בעד ${esc(t.globalOT)} שעות נוספות בחודש ישולם גמול קבוע של ${esc(t.globalOTAmount)} ₪ כרכיב נפרד בתלוש, בנוסף לשכר הרגיל. רכיב זה הוא תמורה לשעות נוספות בלבד ואינו חלק מהשכר הרגיל. המעסיק ינהל רישום של שעות העבודה בפועל; בחודש שבו השעות הנוספות בפועל עולות על המכסה – ישולם ההפרש לפי החוק.`, !!t.globalOT)}

  ${P(`השכר משתלם בעד תקופה של חודש קלנדרי${hourly ? " (גם לעובד בשכר שעתי, בהסכמת הצדדים)" : ""}. הוא ישולם בהעברה לחשבון הבנק של העובד, בתום החודש שבעדו הוא משתלם, ולא יאוחר מה-9 בחודש שלאחריו – המועד שלאחריו השכר נחשב שכר מולן לפי חוק הגנת השכר. תלוש שכר יימסר לעובד כדין.`)}
  ${P(`מהשכר ינוכו מס הכנסה, דמי ביטוח לאומי וביטוח בריאות, חלק העובד בהפרשות הפנסיוניות וכל ניכוי אחר המותר לפי חוק הגנת השכר, התשי"ח-1958.`)}
  ${P(`עמלות: ${esc(t.commission)}. העמלה מחושבת על סכום העסקה לפני מע"מ, בגין עסקאות שהעובד סגר ושהכסף בעדן התקבל. עמלה משולמת עם שכר החודש שלאחר החודש שבו התקבל התשלום מהלקוח, והעובד יקבל פירוט של חישובה. עסקה שבוטלה או הוחזרה לפני שהתקבל בעדה תשלום – אינה מזכה בעמלה; קיזוז עמלה ששולמה ייעשה רק כמותר בחוק הגנת השכר. העמלות משולמות כתוספת לשכר היסוד; הכללתן בבסיס לזכויות סוציאליות תיקבע לפי מהותן ולפי הדין, ואין בהסכם זה כדי לשלול אותה.`, !!t.commission)}
  ${P(`תנאים נוספים: ${esc(t.extras)}`, !!t.extras)}
  ${P("מענק חד-פעמי או הטבה שהוגדרו מראש ככאלה לא יהוו כשלעצמם התחייבות לתשלומים דומים בעתיד, בכפוף לדין.")}

  ${P(`<b>דמי מחלה</b> – לפי חוק דמי מחלה, התשל"ו-1976: צבירה של יום וחצי לכל חודש עבודה מלא, עד 90 ימים${hourly || Number(t.weeklyHours) < 42 ? "; לעובד שאינו עובד חודש מלא – הצבירה יחסית לפי ימי העבודה, כקבוע בדין" : ""}. התשלום: ללא תשלום ביום המחלה הראשון, 50% בימים השני והשלישי, ו-100% מהיום הרביעי – למעט מקרים שבהם הדין קובע אחרת. העובד יודיע על מחלתו בהקדם וימציא אישור מחלה כדין.`)}
  ${P(hourly ? "<b>חגים</b> – לעובד בשכר שעתי ישולמו דמי חגים לפי צו ההרחבה הכללי ובתנאי הזכאות הקבועים בו (בין היתר: ותק של שלושה חודשים, חג שאינו חל ביום המנוחה, ואי-היעדרות ביום שלפני החג וביום שאחריו ללא הסכמת המעסיק)." : "<b>חגים</b> – לעובד בשכר חודשי לא יופחת השכר בשל ימי חג, לפי צו ההרחבה הכללי.")}
  ${P("<b>דמי הבראה</b> – לפי צו ההרחבה הכללי, לאחר שנת עבודה, בהתאם לוותק ולהיקף המשרה.")}
  ${P(`<b>נסיעות</b> – החזר הוצאות נסיעה לעבודה וממנה לפי צו ההרחבה${t.travel ? `: ${esc(t.travel)}` : ""}.`)}
  ${P("<b>שירות מילואים</b> – זכויות העובד בתקופת שירות מילואים יהיו לפי הדין.")}

  ${P(`המעסיק יבטח את העובד בביטוח פנסיוני בקופה שיבחר העובד${pensFund ? ` (נכון למועד החתימה: ${esc(pensFund)})` : ""}, ובהיעדר בחירה – בקופת ברירת מחדל לפי הדין. ${pens === "yes" ? "העובד הצהיר כי יש לו ביטוח פנסיוני קודם; לכן, כקבוע בצו לעובד כזה, הזכאות להפרשות היא ככלל מהיום הראשון לעבודה, וההפקדות יועברו לא יאוחר מתום 3 חודשי עבודה או מתום שנת המס – לפי המוקדם, כקבוע בצו ההרחבה לביטוח פנסיוני מקיף במשק." : pens === "no" ? "העובד הצהיר כי אין לו ביטוח פנסיוני קודם; לכן ההפרשות יחלו במועד הקבוע בצו ההרחבה לביטוח פנסיוני מקיף במשק לעובד כזה – ככלל, בתום 6 חודשי עבודה." : "מועד תחילת ההפרשות ייקבע לפי צו ההרחבה לביטוח פנסיוני מקיף במשק, בהתאם לשאלה אם לעובד יש ביטוח פנסיוני קודם. העובד ימסור למעסיק את פרטי הביטוח הקיים, אם יש."} ${pensAgeNote} אין באמור כדי לגרוע מזכאות מוקדמת יותר לפי צו ענפי או הסכם.`)}
  ${P(`השכר המבוטח: השכר הרגיל של העובד, ולא פחות מהשכר שהדין מחייב לבטח. החזר הוצאות (כגון נסיעות) אינו נכלל בו. שיעורי ההפרשה: עובד <b>${esc(t.empPct||"6")}%</b>, מעסיק לתגמולים <b>${esc(t.erPct||"6.5")}%</b>, מעסיק לפיצויים <b>${esc(t.sevPct||"6")}%</b>.`)}

    : `על הפקדות המעסיק לפיצויים בשיעור 6%, המתחייבות לפי צו ההרחבה לביטוח פנסיוני מקיף במשק, יחול סעיף 14 לחוק פיצויי פיטורים, התשכ"ג-1963, כך שיבואו במקום <b>72%</b> מפיצויי הפיטורים בעד השכר, הרכיבים והתקופה שבעדם הופקדו. את היתרה ישלים המעסיק בסיום העבודה, ככל שתקום לעובד זכאות לפיצויי פיטורים לפי הדין.`}
    המעסיק מוותר על כל זכות להחזר כספים מהכספים שהופקדו לפיצויים, למעט אם נשללה זכות העובד לפיצויי פיטורים בפסק דין מכוח סעיף 16 או 17 לחוק, או אם העובד משך את הכספים שלא לרגל אירוע מזכה – והכל כקבוע בהסדר שהוחל ובדין.`, !!t.sec14)}
  ${P(`<b>קרן השתלמות</b> – החל מ${t.hishFrom ? esc(t.hishFrom) : "תחילת העבודה"}: הפרשות מעסיק ${esc(t.hishEr||"7.5")}% והפרשות עובד ${esc(t.hishEmp||"2.5")}% מהשכר הרגיל, בקרן שיבחר העובד.`, !!(t.hishEmp || t.hishEr))}

  ${t.cash ? `${H("כספים, קופה ומלאי")}
  ${P("העובד יפעל בכל הקשור לכספים, לקופה ולמלאי לפי נהלי המעסיק. העובד לא יעניק הנחות, לא יבצע ביטולי עסקאות, החזרים כספיים, משיכות מהקופה, מתן אשראי או הוצאת מוצרים – ללא הרשאה מתאימה.")}
  ${P("העובד ידווח ללא דיחוי על כל חוסר, אי-התאמה או פעולה חריגה שהתגלו במהלך עבודתו. אין בסעיף זה כדי להטיל על העובד אחריות אוטומטית לחוסרים, ולא ינוכה סכום משכרו אלא כמותר בחוק הגנת השכר.")}` : ""}

    <p class="note" id="linkNote">${SEND_URL ? "הקישור אטום: התנאים שמורים בשרת המשרד, הקישור תקף 30 יום ולשליחה אחת." : "מצב ידני: תנאי ההעסקה ושם העובד <b>דחוסים בתוך הקישור, לא מוצפנים</b> – כל מי שמחזיק בקישור יכול לקרוא אותם. שלח/י אותו רק לעובד עצמו. פרטים אישיים שהעובד ממלא לא עוברים בקישור."}</p>

  const pad = sigPad($("#sigEmp"));
  const v = id => ($("#"+id)||{value:""}).value.trim();
  const collect = () => {
    const t = {
      v:3, mode:rv("mode"), f101:rv("mode")==="change" ? "" : rv("f101"), ownerEmail:v("ownerEmail"), empName:v("empName"),
      company:v("company"), companyId:v("companyId"), deductions:v("deductions"), ephone:v("ephone"), address:v("address"), industry:v("industry"), collective:v("collective"),
      signer:v("signer"), manager:v("manager"), harassContact:v("harassContact"),
      role:v("role"), start:rv("mode")==="change" ? v("origStart") : v("start"), weeklyHours:v("weeklyHours"), restDay:v("restDay"), probation:rv("mode")==="change" ? "" : v("probation"),
      days:$$("[data-day]").map(el => el.value.trim()),
      wageType:v("wageType"), wage:v("wage"), globalOT:v("globalOT"), commission:v("commission"), travel:v("travel"), extras:v("extras"),
      pensionFund:v("pensionFund"), empPct:v("empPct"), erPct:v("erPct"), sevPct:v("sevPct"), sec14:$("#sec14").checked,
      workplace:v("workplace"), breakPaid:$("#breakPaid").checked, cash:$("#cash").checked, cameras:$("#cameras").checked, hishEr:v("hishEr"), hishEmp:v("hishEmp"), hishFrom:v("hishFrom"),
      pattern:v("pattern"), breakMin:v("breakMin"), shortDay:v("pattern")==="5" ? v("shortDay") : "", breakPermit:$("#breakPermit").checked, youth:$("#youth").checked,
      globalOTAmount:v("globalOTAmount"), unionInfo:v("collective") ? v("unionInfo") : "", camPolicy:$("#cameras").checked && $("#camPolicy").checked,
      okSig:(PRESET && PRESET.okSig) || "", okTpl:(PRESET && PRESET.okTpl) || "", tok:(PRESET && PRESET.tok) || "",
      effDate:v("effDate"), chgReason:v("chgReason")
    };
    if(hoursPlan(t).night) t.night = true;
    if(t.mode === "change"){ t.changed = $$("[data-chg]").filter(e => e.checked).map(e => e.dataset.chg); t.prev = {};
      t.changed.forEach(k => { if(k === "wage"){ t.prev.wage = v("prev_wage"); t.prev.wageType = v("prev_wageType"); } else t.prev[k] = v("prev_"+k); });
      if(t.changed.includes("other")) t.otherAfter = v("otherAfter"); }
    Object.keys(t).forEach(k => { if(t[k] === "" || t[k] === false) delete t[k]; }); if(t.days && !t.days.some(Boolean)) delete t.days;
    return t;
  };
  const drawChecks = () => {
    const t = collect(), {err, warn} = checkTerms(t);
    $("#checks").innerHTML = (err.length || warn.length) ?
      err.map(x => `<div class="warn" style="background:#fdecec;border-color:#f3b4b4;color:#a11;margin:6px 0">⛔ ${esc(x)}</div>`).join("") +
      warn.map(x => `<div class="warn" style="margin:6px 0">⚠️ ${esc(x)}</div>`).join("") +
      (err.concat(warn).some(x => x.includes("שעות עבודה בשבוע")) ? `<div class="btns"><button class="btn sec" type="button" id="fixHours">עדכן היקף לפי הימים והשעות</button></div>` : "")

    $$("[data-after]").forEach(el => el.value = chgAfter(t, el.dataset.after));
    $("#unionBox").classList.toggle("hidden", !t.collective); $("#camPolicyBox").classList.toggle("hidden", !t.cameras); $("#shortBox").classList.toggle("hidden", (t.pattern||"5") !== "5");

  };
  const modeShow = () => { const ch = rv("mode") === "change";

  $$('[name=mode]').forEach(r => r.onchange = modeShow);
  $$("[data-chg]").forEach(el => el.addEventListener("change", () => $(`[data-chgbox="${el.dataset.chg}"]`).classList.toggle("hidden", !el.checked)));
  if(PRESET && PRESET.industry) $("#industry").value = PRESET.industry;
  if(PRESET && PRESET.okSig){ $("#industry").disabled = true; $("#collective").disabled = true; if(PRESET.collective) $("#collective").value = PRESET.collective; } // ענף והסכם נעולים לאישור החתום
  $("#app").addEventListener("input", drawChecks);

  $("#another").onclick = () => { renderSetup(); window.scrollTo(0,0); };
  modeShow();
  $("#makeLink").onclick = async () => {
    const ch = rv("mode") === "change";
    const need = [["company","שם העסק"],["address","כתובת העסק"],["signer","שם החותם"],["ownerEmail","המייל שלך"],["empName","שם העובד"],["role","תפקיד"],["weeklyHours","היקף שעות"],["wage","סכום השכר"]];
    need.push(["harassContact","האחראי לתלונות על הטרדה מינית"]);
    if(ch) need.push(["effDate","מועד השינוי"]); else need.push(["start","תאריך תחילה"]);
    for(const [k,n] of need){ if(!v(k)) return bad(k, "חסר: " + n); }
    if(!/^\S+@\S+\.\S+$/.test(v("ownerEmail"))) return bad("ownerEmail","המייל לא תקין");

    if(pad.isEmpty()){ $("#sigEmp").scrollIntoView({behavior:"smooth",block:"center"}); return toast("חסרה חתימת המעסיק"); }

function waHref(phone, name, company, url, mode){

  return "https://wa.me/" + (p.length >= 11 ? p : "") + "?text=" + encodeURIComponent(msg);

function shrink(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej;
  r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => { const max = 1500, s = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.8)); }; img.src = r.result; };
  r.readAsDataURL(file); }); }

/* html2canvas loses spaces / misplaces punctuation in Hebrew. Wrap every word in an inline-block span. */
function prepRTL(root){
  const heb = /[֐-׿]/;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(tn => {
    const t = tn.nodeValue; if(!t.trim()) return;
    const parent = tn.parentNode; if(!parent || parent.closest(".noprep")) return;
    const frag = document.createDocumentFragment();
    t.split(/(\s+)/).forEach(part => {
      if(!part) return;
      if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(" ")); return; }
      const sp = document.createElement("span"); sp.style.display = "inline-block";
      if(heb.test(part)) sp.textContent = "\u200F" + part + "\u200F"; else { sp.textContent = "\u200E" + part + "\u200E"; }
      frag.appendChild(sp);
    });
    parent.replaceChild(frag, tn);
  });
}

async function renderPdf(html){

  await Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
  while(typeof html2pdf === "undefined") await new Promise(r => setTimeout(r, 300));
  return html2pdf().set({ margin:0, image:{type:"jpeg",quality:0.86}, html2canvas:{scale:1.6,useCORS:true,backgroundColor:"#fff"}, jsPDF:{unit:"px",format:[794,1122],orientation:"portrait",hotfixes:["px_scaling"],compress:true}, pagebreak:{mode:["css","avoid-all"],before:".pb",avoid:["tr",".sigs",".sec",".kv"]} }).from(box).outputPdf("blob");
}

/* ================= routing ================= */
async function route(){
  const h = location.hash;
  const stop = msg => { header("", "לא ניתן לפתוח את הקישור", ""); $("#app").innerHTML = `<div class="card warn">${msg}</div>`; };
  try{
    if(h.startsWith("#r=")){
      if(!SEND_URL) throw new Error("bad");
      const id = h.slice(3).replace(/[^0-9a-f]/g,"");
      const r = await fetch(SEND_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({app:"office-forms-v2", action:"get", linkId:id})});
      const j = await r.json();
      if(!j.ok) return stop({used:"המסמכים בקישור הזה כבר נשלחו. אם צריך לשלוח שוב – בקש/י מהמעסיק קישור חדש.", expired:"תוקף הקישור (30 יום) הסתיים. בקש/י מהמעסיק קישור חדש.", revoked:"המעסיק ביטל את הקישור הזה."}[j.err] || "הקישור לא נמצא. בקש/י מהמעסיק לשלוח אותו שוב.");
      T = j.terms; T.termsHash = j.sha;
    }
    else if((h.startsWith("#k=") || h.startsWith("#e=")) && SEND_URL) return stop("הקישור הזה מגרסה ידנית ואינו תקף במערכת השליחה. בקש/י מהמעסיק ליצור קישור חדש.");
    else if(h.startsWith("#k=")) T = await unpackK(h.slice(3));
    else if(h.startsWith("#e=")) T = b64urlDecode(decodeURIComponent(h.slice(3)));
  }catch(e){
    return stop(e && e.message === "nodecomp" ? "הדפדפן בטלפון הזה ישן מדי לפתיחת הקישור. עדכן/י את Chrome או Safari ונסה/י שוב." : "הקישור פגום או חלקי. בקש/י מהמעסיק לשלוח אותו שוב.");
  }
  if(T && Number(T.v) !== LINK_VER) return stop("הקישור הזה נוצר בגרסה קודמת של הטופס, ולא ניתן להשתמש בו. בקש/י מהמעסיק ליצור קישור חדש – זה לוקח דקה.");
  if(T && checkTerms(T).err.length) return stop("בתנאים שבקישור יש שגיאה שהמעסיק צריך לתקן. בקש/י ממנו ליצור קישור חדש.");
  if(T){ renderWelcome(); return; }
  if(h.startsWith("#s=")){ try{ PRESET = b64urlDecode(h.slice(3)); }catch(e){ PRESET = null; } }
  renderSetup();
}
