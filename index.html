<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2a44">
<title>קליטת עובד – הסכם עבודה וטופס 101</title>
<style>
  :root{--ink:#1c2333;--mute:#5d6678;--line:#d9dde5;--bg:#f5f6f8;--card:#fff;--acc:#1f2a44;--ok:#1d7a4a;--warn:#a5520c}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
  header{background:var(--acc);color:#fff;padding:14px 18px}
  header h1{margin:0;font-size:19px}
  header p{margin:2px 0 0;font-size:13px;opacity:.85}
  main{max-width:760px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:17px}
  .card h3{margin:14px 0 6px;font-size:15px}
  label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:70px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  .chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:15px;color:var(--ink)}
  .chk input{width:20px;height:20px;flex:none;margin-top:2px}
  .req::after{content:" *";color:#b3261e}
  .btn{display:inline-block;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;text-decoration:none;text-align:center}
  .btn.sec{background:#e7eaf0;color:var(--ink)}
  .btn.ok{background:var(--ok)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .note{font-size:13px;color:var(--mute)}
  .warn{background:#fff6ea;border:1px solid #f1d2ad;color:var(--warn);padding:10px;border-radius:8px;font-size:14px}
  .steps{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
  .steps span{font-size:13px;padding:4px 10px;border-radius:20px;background:#e7eaf0;color:var(--mute)}
  .steps span.on{background:var(--acc);color:#fff}
  .sig{border:1.5px dashed #9aa3b5;border-radius:8px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
  .days{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;align-items:center}
  .days b{font-weight:500;font-size:14px}
  .doc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;max-height:420px;overflow:auto;font-size:14.5px}
  .doc h4{margin:12px 0 4px;font-size:15px}
  .doc p,.doc li{margin:4px 0}
  table.kids{width:100%;border-collapse:collapse;font-size:14px}
  table.kids td,table.kids th{border:1px solid var(--line);padding:4px}
  table.kids input{padding:6px}
  .hidden{display:none!important}
  .linkbox{word-break:break-all;background:#f0f2f6;border-radius:8px;padding:10px;font-size:13px;direction:ltr;text-align:left}
  /* PDF output */
  #pdf{width:794px;padding:36px 44px;background:#fff;color:#000;font-size:13px;line-height:1.45;direction:rtl}
  #pdf h1{font-size:18px;margin:0 0 6px;text-align:center}
  #pdf h2{font-size:15px;margin:16px 0 6px;border-bottom:1px solid #000;padding-bottom:2px}
  #pdf table{width:100%;border-collapse:collapse;margin:4px 0}
  #pdf td,#pdf th{border:1px solid #888;padding:3px 6px;vertical-align:top;font-size:12.5px}
  #pdf .sigimg{height:60px}
  #pdf .pb{page-break-before:always}
  #pdf .meta{font-size:11px;color:#333;text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="hdr">קליטת עובד חדש</h1>
  <p id="sub">הסכם עבודה וטופס 101 – בחתימה דיגיטלית</p>
</header>
<main id="app"></main>

<!-- PDF render target (offscreen) -->
<div style="position:fixed;left:-10000px;top:0"><div id="pdf"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<script>
"use strict";
/* ============ helpers ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function b64urlEncode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "=";
  const bin = atob(s); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function fmtDate(d){ if(!d) return ""; const [y,m,dd] = d.split("-"); return dd && m && y ? `${dd}/${m}/${y}` : d; }
function nowStamp(){ const d = new Date(); return d.toLocaleString("he-IL",{timeZone:"Asia/Jerusalem"}); }
function validId(id){
  id = String(id||"").trim(); if(!/^\d{5,9}$/.test(id)) return false;
  id = id.padStart(9,"0"); let sum = 0;
  for(let i=0;i<9;i++){ let n = Number(id[i]) * ((i%2)+1); sum += n>9 ? n-9 : n; }
  return sum % 10 === 0;
}

/* signature pad */
function sigPad(canvas){
  const ctx = canvas.getContext("2d"); let drawing = false, dirty = false, last = null;
  function fit(){ const r = canvas.getBoundingClientRect(); const dpr = Math.max(1, window.devicePixelRatio||1);
    canvas.width = r.width*dpr; canvas.height = r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1b4a"; dirty = false; }
  fit();
  const pos = e => { const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  canvas.addEventListener("pointerdown", e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", e => { if(!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; dirty = true; });
  ["pointerup","pointercancel","pointerleave"].forEach(t => canvas.addEventListener(t, () => drawing = false));
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); dirty = false; },
    isEmpty(){ return !dirty; },
    data(){ // small PNG: trim to a 400x130 copy
      const c = document.createElement("canvas"); c.width = 400; c.height = 130;
      const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,400,130);
      x.drawImage(canvas,0,0,400,130); return c.toDataURL("image/jpeg",0.6);
    }
  };
}

/* ============ agreement text ============ */
function wageText(t){
  if(t.wageType === "monthly") return `שכר חודשי ברוטו בסך ${esc(t.wage)} ₪ למשרה בהיקף המפורט לעיל.`;
  return `שכר שעתי ברוטו בסך ${esc(t.wage)} ₪ לשעת עבודה.`;
}
function scheduleText(t){
  const rows = DAYS.map((d,i) => t.days && t.days[i] ? `<li>יום ${d}: ${esc(t.days[i])}</li>` : "").join("");
  return rows ? `<ul>${rows}</ul>` : "<p>לפי סידור עבודה שיימסר לעובד מראש.</p>";
}
function agreementHTML(t, emp){
  const name = emp && emp.fullName ? esc(emp.fullName) : "__________";
  const id = emp && emp.idNum ? esc(emp.idNum) : "__________";
  const pension = t.pensionFund ? `בקופה: ${esc(t.pensionFund)}` : "בקופה שיבחר העובד, ובהיעדר בחירה – בקרן ברירת המחדל שנבחרה על ידי המעסיק";
  return `
  <p><b>הסכם עבודה אישי והודעה לעובד על תנאי עבודה</b><br>
  לפי חוק הודעה לעובד ולמועמד לעבודה (תנאי עבודה ומיון והליכי קבלה לעבודה), התשס"ב-2002</p>
  <p><b>בין:</b> ${esc(t.company)}${t.companyId ? `, ח.פ/ע.מ ${esc(t.companyId)}` : ""}, ${esc(t.address)} (להלן: "המעסיק")<br>
  <b>לבין:</b> ${name}, ת"ז ${id} (להלן: "העובד")</p>

  <h4>1. התפקיד ותחילת העבודה</h4>
  <p>העובד יועסק בתפקיד <b>${esc(t.role)}</b> החל מיום <b>${fmtDate(t.start)}</b>. הממונה הישיר: ${esc(t.manager || t.signer)}.
  ${t.probation ? `שלושת החודשים הראשונים${t.probation!=="3"?` (${esc(t.probation)} חודשים)`:""} הם תקופת ניסיון, שבמהלכה רשאי כל צד לסיים את ההעסקה בהודעה מוקדמת כדין.` : ""}
  ההעסקה היא לתקופה בלתי קצובה, אלא אם צוין אחרת בכתב.</p>

  <h4>2. ימי עבודה ושעות עבודה</h4>
  <p>היקף המשרה: <b>${esc(t.weeklyHours)}</b> שעות שבועיות. יום המנוחה השבועי: <b>${esc(t.restDay)}</b>.</p>
  ${scheduleText(t)}
  <p>העבודה בשעות נוספות תיעשה רק לפי דרישת המעסיק או באישורו מראש, ותשולם לפי חוק שעות עבודה ומנוחה, התשי"א-1951.
  העובד ידווח על שעות עבודתו באמצעי הרישום שיקבע המעסיק.</p>

  <h4>3. שכר</h4>
  <p>${wageText(t)} השכר ישולם לא יאוחר מה-9 בחודש שלאחר החודש שבעדו הוא משתלם, בהעברה לחשבון הבנק של העובד.</p>
  ${t.globalOT ? `<p>גמול שעות נוספות גלובלי: ${esc(t.globalOT)} שעות נוספות בחודש ישולמו כתוספת נפרדת בתלוש. תוספת זו היא תמורה עבור שעות נוספות בלבד ואינה חלק מהשכר הרגיל. ככל שהעובד יעבוד בפועל יותר מכך – ישולם לו ההפרש כדין.</p>` : ""}
  ${t.commission ? `<p>עמלות: ${esc(t.commission)}. העמלות משולמות כתוספת לשכר היסוד ואינן מהוות חלק ממנו, למעט ככל שהדין קובע אחרת.</p>` : ""}
  ${t.extras ? `<p>תנאים נוספים: ${esc(t.extras)}</p>` : ""}

  <h4>4. נסיעות, הבראה וחופשה</h4>
  <p>החזר הוצאות נסיעה לעבודה וממנה, דמי הבראה, ימי חופשה שנתית, דמי מחלה ותשלום חגים – לפי הדין, צו ההרחבה הכללי ובהתאם לוותק.
  ${t.travel ? `החזר נסיעות: ${esc(t.travel)}.` : ""}</p>

  <h4>5. פנסיה ופיצויים</h4>
  <p>המעסיק יבטח את העובד בביטוח פנסיוני ${pension}, החל מהמועד הקבוע בצו ההרחבה לביטוח פנסיוני מקיף במשק (לרבות רטרואקטיבית ככל שנדרש):
  הפרשות עובד ${esc(t.empPct||"6")}%, הפרשות מעסיק לתגמולים ${esc(t.erPct||"6.5")}%, והפרשות מעסיק לפיצויים ${esc(t.sevPct||"6")}%${t.sevPct && Number(t.sevPct) >= 8.33 ? "" : " (או בשיעור גבוה יותר שיוסכם)"}.</p>
  ${t.sec14 ? `<p><b>סעיף 14:</b> הצדדים מסכימים כי על ההפרשות לפיצויים יחול האישור הכללי בדבר תשלומי מעביד לקרן פנסיה ולקופת ביטוח במקום פיצויי פיטורים, לפי סעיף 14 לחוק פיצויי פיטורים, התשכ"ג-1963. ההפרשות ייעשו במקום פיצויי פיטורים בשיעור ההפרשה${Number(t.sevPct||6) >= 8.33 ? " (100%)" : ` (${esc(t.sevPct||"6")}/8.33 מהפיצויים, וההשלמה – לפי הדין)`}, וכספי הפיצויים שנצברו ישוחררו לעובד בסיום העבודה, למעט במקרים שבהם נשללה זכאות לפיצויים בפסק דין או בהסכם.</p>` : ""}

  <h4>6. סודיות, ציוד ומערכות</h4>
  <p>העובד ישמור בסוד כל מידע עסקי, מסחרי או אישי על המעסיק, לקוחותיו וספקיו, ולא ישתמש בו אלא לצורך עבודתו – גם לאחר סיום ההעסקה.
  ציוד, מסמכים ומערכות שנמסרו לעובד הם רכוש המעסיק ויוחזרו בסיום העבודה.
  תיבת דואר אלקטרוני ומערכות שהעמיד המעסיק נועדו לשימוש לצורכי עבודה. המעסיק רשאי לנטר את השימוש בהן בהתאם למדיניות שתימסר לעובד ובכפוף לדין, ולא יעיין בתכנים אישיים אלא בהסכמת העובד או לפי הדין.</p>

  <h4>7. מניעת הטרדה מינית</h4>
  <p>העובד מאשר כי הובא לידיעתו שהמעסיק פועל לפי החוק למניעת הטרדה מינית, התשנ"ח-1998, וכי ידוע לו למי לפנות בתלונה${t.harassContact ? ` (${esc(t.harassContact)})` : ""}. ככל שהמעסיק מחויב בתקנון – התקנון נמסר לעובד או הוצג לו.</p>

  <h4>8. סיום העבודה</h4>
  <p>כל צד רשאי לסיים את ההעסקה בהודעה מוקדמת כקבוע בחוק הודעה מוקדמת לפיטורים ולהתפטרות, התשס"א-2001. פיטורים ייעשו לאחר שימוע כדין.</p>

  <h4>9. כללי</h4>
  <p>הסכם זה מהווה גם הודעה לעובד על תנאי עבודתו. שינוי בתנאים יימסר לעובד בכתב. אין בהסכם כדי לגרוע מזכות המוקנית לעובד לפי דין, צו הרחבה או הסכם קיבוצי החל עליו.
  העובד מצהיר כי קרא את ההסכם, הבין אותו והוא מסכים לתנאיו. חתימה אלקטרונית על הסכם זה כמוה כחתימה בכתב יד.</p>`;
}

/* ============ setup (employer) ============ */
function renderSetup(){
  $("#hdr").textContent = "הכנת הסכם עבודה";
  $("#sub").textContent = "המעסיק ממלא את התנאים, חותם, ושולח לעובד קישור אישי";
  const saved = store.get("employer") || {};
  const dayRows = DAYS.map((d,i) => `<b>${d}</b><input data-day="${i}" placeholder="למשל 09:00-17:00 (ריק = לא עובד)">`).join("");
  $("#app").innerHTML = `
  <div class="steps"><span class="on">1. תנאים</span><span>2. חתימת מעסיק</span><span>3. קישור לעובד</span></div>

  <div class="card">
    <h2>לאן נשלחים המסמכים החתומים</h2>
    <div class="row">
      <div><label class="req">המייל שלך</label><input id="ownerEmail" type="email" value="${esc(saved.ownerEmail||"")}"></div>
      <div><label class="req">מייל רואה החשבון</label><input id="cpaEmail" type="email" value="${esc(saved.cpaEmail||"")}"></div>
    </div>
    <p class="note">הכתובות ופרטי החברה נשמרים רק במכשיר הזה, כדי שלא תצטרך למלא אותם בכל פעם.</p>
  </div>

  <div class="card">
    <h2>פרטי המעסיק</h2>
    <div class="row">
      <div><label class="req">שם החברה / העסק</label><input id="company" value="${esc(saved.company||"")}"></div>
      <div><label>ח.פ / ע.מ</label><input id="companyId" inputmode="numeric" value="${esc(saved.companyId||"")}"></div>
    </div>
    <label class="req">כתובת העסק</label><input id="address" value="${esc(saved.address||"")}">
    <div class="row">
      <div><label class="req">שם החותם מטעם המעסיק</label><input id="signer" value="${esc(saved.signer||"")}"></div>
      <div><label>ממונה ישיר (אם אחר)</label><input id="manager"></div>
    </div>
    <label>איש קשר לתלונות על הטרדה מינית</label><input id="harassContact" value="${esc(saved.harassContact||"")}" placeholder="שם ותפקיד">
  </div>

  <div class="card">
    <h2>תפקיד ושעות</h2>
    <div class="row">
      <div><label class="req">תפקיד</label><input id="role"></div>
      <div><label class="req">תאריך תחילת עבודה</label><input id="start" type="date"></div>
    </div>
    <h3>ימים ושעות</h3>
    <div class="days">${dayRows}</div>
    <div class="btns"><button class="btn sec" type="button" id="fillWeek">א׳–ה׳ 09:00-17:00</button><button class="btn sec" type="button" id="clearWeek">נקה</button></div>
    <div class="row">
      <div><label class="req">היקף שעות שבועי</label><input id="weeklyHours" inputmode="decimal"></div>
      <div><label class="req">יום מנוחה שבועי</label>
        <select id="restDay"><option>שבת</option><option>שישי</option><option>ראשון</option></select></div>
    </div>
    <label>תקופת ניסיון (חודשים)</label>
    <select id="probation"><option value="">ללא</option><option value="3" selected>3</option><option value="6">6</option></select>
  </div>

  <div class="card">
    <h2>שכר ותנאים</h2>
    <div class="row">
      <div><label class="req">סוג שכר</label><select id="wageType"><option value="hourly">שעתי</option><option value="monthly">חודשי</option></select></div>
      <div><label class="req">סכום ברוטו (₪)</label><input id="wage" inputmode="decimal"></div>
    </div>
    <label>שעות נוספות גלובליות בחודש (רק אם יש)</label><input id="globalOT" inputmode="decimal">
    <label>עמלות (רק אם יש) – אחוז, על מה, ובסיס החישוב</label><textarea id="commission" placeholder="למשל: 5% ממכירות מוצרים, לפני מע&quot;מ"></textarea>
    <label>החזר נסיעות</label><input id="travel" placeholder="למשל: לפי צו ההרחבה / חופשי חודשי">
    <label>תנאים נוספים</label><textarea id="extras"></textarea>
    <h3>פנסיה</h3>
    <label>קופת פנסיה (אם ידוע)</label><input id="pensionFund">
    <div class="row">
      <div><label>עובד %</label><input id="empPct" value="6" inputmode="decimal"></div>
      <div><label>מעסיק תגמולים %</label><input id="erPct" value="6.5" inputmode="decimal"></div>
    </div>

  <h2>ג. ילדים</h2>${kids}
  <h2>ד. ההכנסה ממעסיק זה</h2><p>${esc(F.incType)} · מתאריך ${fmtDate(F.incStart)}</p>
  <h2>ה. הכנסות אחרות</h2>
  <p>${F.otherInc==="yes" ? `יש: ${esc(F.otherDesc)} · ${F.credHere==="here"?"מבקש/ת נקודות זיכוי ומדרגות מס כאן":"מקבל/ת נקודות זיכוי בהכנסה אחרת"}${F.coord?" · יש אישור תיאום מס":""}` : "אין לי הכנסות אחרות"}</p>
  <h2>ו. בן/בת זוג</h2>
  <p>${F.spName ? `${esc(F.spName)} · ת"ז ${esc(F.spId)} · ${fmtDate(F.spBirth)} · ${esc(F.spInc)}` : "—"}</p>
  <h2>ח. בקשות לפטור או זיכוי</h2>
  ${F.credits.length ? `<ul>${F.credits.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>` : "<p>לא התבקשו</p>"}
  ${F.credDetails ? `<p>פרטים: ${esc(F.credDetails)}</p>` : ""}
  <h2>ט. הצהרה</h2>
  <p>אני מצהיר/ה כי הפרטים שמסרתי בטופס זה מלאים ונכונים, וידוע לי שהשמטה או מסירת פרטים לא נכונים הן עבירה על פקודת מס הכנסה. אני מתחייב/ת להודיע למעסיק על כל שינוי בתוך שבוע.</p>
  <p>חתימת העובד: <img class="sigimg" src="${E.sig}"> · ${esc(E.signedAt)}</p>
  ${idImg ? `<div class="pb"></div><h2>צילום תעודת זהות</h2><img src="${idImg}" style="max-width:100%;max-height:900px">` : ""}`;
}

let pdfBlob = null;
function renderSend(){
  window.scrollTo(0,0);
  $("#hdr").textContent = "סיום ושליחה";
  $("#sub").textContent = T.company;
  const fname = `הסכם עבודה ו-101 – ${E.first} ${E.last} – ${T.company}.pdf`;
  $("#app").innerHTML = `
  <div class="steps"><span>1. פרטים והסכם ✓</span><span>2. טופס 101 ✓</span><span class="on">3. שליחה</span></div>
  <div class="card">
    <h2>המסמך החתום מוכן</h2>
    <p id="pdfState">מכין PDF…</p>
    <div class="btns">
      <button class="btn ok" type="button" id="share" disabled>שלח למעסיק ולרואה החשבון</button>
      <button class="btn sec" type="button" id="dl" disabled>הורד PDF</button>
    </div>
    <p class="note">בלחיצה על "שלח" ייפתח חלון השיתוף של הטלפון – בחר במייל או בוואטסאפ. אם השיתוף לא עובד: הורד את ה-PDF וצרף אותו למייל אל ${esc(T.ownerEmail)} ו-${esc(T.cpaEmail)}.</p>
    <div class="btns"><a class="btn sec" id="mail">פתח מייל מוכן (בלי קובץ)</a></div>
  </div>`;
  $("#mail").href = `mailto:${encodeURIComponent(T.ownerEmail)}?cc=${encodeURIComponent(T.cpaEmail)}&subject=${encodeURIComponent("הסכם עבודה וטופס 101 – "+E.first+" "+E.last)}&body=${encodeURIComponent("מצורף ה-PDF החתום (הסכם עבודה וטופס 101).")}`;
  $("#pdf").innerHTML = buildPdfHTML();
  const go = () => {
    if(typeof html2pdf === "undefined"){ setTimeout(go, 400); return; }
    html2pdf().set({ margin:[8,8,8,8], filename:fname, image:{type:"jpeg",quality:0.9}, html2canvas:{scale:2,useCORS:true}, jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, pagebreak:{mode:["css"],before:".pb"} })
      .from($("#pdf")).outputPdf("blob").then(b => {
        pdfBlob = b; $("#pdfState").textContent = "ה-PDF מוכן ✓"; $("#share").disabled = false; $("#dl").disabled = false;
      }).catch(() => { $("#pdfState").textContent = "לא הצלחתי להפיק PDF במכשיר הזה. נסה מדפדפן אחר (כרום)."; });
  };
  go();
  $("#dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(pdfBlob); a.download = fname; a.click(); };
  $("#share").onclick = async () => {
    const file = new File([pdfBlob], fname, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:fname, text:`הסכם עבודה וטופס 101 חתומים – ${E.first} ${E.last}. לשליחה אל ${T.ownerEmail}, ${T.cpaEmail}`}); }
      catch(e){ /* user cancelled */ }
    } else { $("#dl").click(); alertBox("השיתוף הישיר לא נתמך במכשיר הזה – הקובץ ירד. צרף אותו למייל."); }
  };
}

/* ============ misc ============ */
function alertBox(msg){
  let el = $("#toast"); if(!el){ el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2333;color:#fff;padding:12px 16px;border-radius:10px;max-width:92%;z-index:9;font-size:15px";
    document.body.appendChild(el); }
  el.textContent = msg; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 3800);
}

function route(){
  const h = location.hash;
  if(h.startsWith("#e=")){
    try{ T = b64urlDecode(h.slice(3)); }catch(e){ $("#app").innerHTML = `<div class="card warn">הקישור פגום. בקש/י מהמעסיק קישור חדש.</div>`; return; }
    renderEmployee();
  } else renderSetup();
}
window.addEventListener("hashchange", route);
route();
</script>
