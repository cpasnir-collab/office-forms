<style>
  :root{--ink:#18203a;--mute:#5f6880;--line:#dfe3ec;--bg:#f3f5fa;--card:#fff;--acc:#15224d;--acc2:#2b4fb8;--ok:#15805a;--warn:#9a4d07;--soft:#eef2fb}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
  header{background:linear-gradient(135deg,#15224d 0%,#24408f 100%);color:#fff;padding:20px 18px 26px}
  header .in{max-width:720px;margin:0 auto}
  header .kicker{font-size:13px;opacity:.8;letter-spacing:.3px}
  header h1{margin:2px 0 0;font-size:22px;font-weight:700}
  header p{margin:4px 0 0;font-size:14px;opacity:.85}
  main{max-width:720px;margin:-14px auto 0;padding:0 12px 110px}
  .progress{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.08)}
  .progress .bar{height:6px;background:#e6eaf3;border-radius:6px;overflow:hidden;margin-top:8px}
  .progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#2b4fb8,#4d7cf2);border-radius:6px;transition:width .4s}
  .progress .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
  .progress .lbl b{color:var(--ink)}
  .card{background:var(--card);border-radius:16px;padding:18px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.08)}
  .card h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}
  .card h2 .n{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--acc2);font-size:14px}
  .card h3{margin:16px 0 6px;font-size:15.5px}
  .help{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;color:#33405f;margin:8px 0 6px}
  .help b{color:var(--acc)}
  label{display:block;font-size:14px;color:var(--mute);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);outline:none;transition:border-color .2s}

  .req::after{content:" *";color:#c62828}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:#fff;transition:all .15s}
  .opt:has(input:checked){border-color:var(--acc2);background:#f4f7ff}
  .opt input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--acc2)}
  .opt .t{font-size:15px}
  .opt .t small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
  .sub{margin:6px 32px 4px 0;padding:10px;border-right:3px solid #c9d5f5;background:#fafbff;border-radius:6px}

  .seg label{position:relative}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:650;cursor:pointer;background:var(--acc2);color:#fff;text-decoration:none;text-align:center}

  .btn.ok{background:var(--ok)}
  .btn.wide{width:100%}

  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .dock{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}
  .dock .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
  .dock .btn{flex:1}
  .note{font-size:13px;color:var(--mute)}
  .warn{background:#fff6ea;border:1px solid #f1d2ad;color:var(--warn);padding:12px;border-radius:10px;font-size:14px}
  .sig{border:1.5px dashed #9aa6c4;border-radius:12px;background:#fcfdff;touch-action:none;width:100%;height:160px;display:block}
  .days{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;align-items:center}
  .days b{font-weight:500;font-size:14px}
  .kidcard{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;position:relative}
  .kidcard .x{position:absolute;left:8px;top:6px;background:none;border:0;color:#c62828;font-size:14px;cursor:pointer}
  .hidden{display:none!important}
  .linkbox{word-break:break-all;background:#f0f3fa;border-radius:10px;padding:10px;font-size:12.5px;direction:ltr;text-align:left;max-height:90px;overflow:auto}
  .terms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}

  .agr{border:1px solid var(--line);border-radius:12px;padding:16px;max-height:430px;overflow:auto;font-size:14.5px;background:#fff}
  .agr .ah{text-align:center;border-bottom:2px solid var(--acc);padding-bottom:10px;margin-bottom:10px}

  .sn{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:#15224d;color:#fff;font-size:12.5px;margin-left:6px}
  .agr p{margin:4px 0}
  .agr ul{margin:4px 0;padding-right:20px}
  .dayl .dayc{display:inline-block;background:#f3f6fd;border-radius:6px;padding:2px 8px;margin:2px 0 2px 6px;font-size:13.5px}
  .agr .parties{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .agr .parties div{background:#f6f8fc;border-radius:8px;padding:8px 10px;font-size:13.5px}
  .agr .parties small{display:block;color:var(--mute)}
  .hero{text-align:center;padding:26px 16px}
  .hero .big{font-size:54px;line-height:1}
  .hero h2{justify-content:center;font-size:22px;margin-top:10px}
  .list{margin:8px 0;padding:0;list-style:none}
  .list li{padding:8px 0 8px 0;border-bottom:1px solid #eef0f5;display:flex;gap:10px}
  .list li:last-child{border:0}
  .list li span{flex:none}
  .filechip{display:flex;justify-content:space-between;align-items:center;background:#f3f6fd;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
  .filechip button{background:none;border:0;color:#c62828;cursor:pointer}
  #toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#18203a;color:#fff;padding:12px 16px;border-radius:12px;max-width:92%;z-index:9;font-size:15px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  /* ===== PDF output ===== */
  #pdf{width:794px;background:#fff;color:#000;direction:rtl;font-family:Arial,"Noto Sans Hebrew",sans-serif}
  #pdf .pg{position:relative;width:794px;height:1118px;overflow:hidden}
  #pdf .bgimg{position:absolute;left:0;top:0;width:794px;height:1118px}
  #pdf .f{position:absolute;font-size:12px;line-height:1;white-space:nowrap;color:#0a2a8a;font-weight:600}
  #pdf .ck{position:absolute;font-size:15px;line-height:1;color:#0a2a8a;font-weight:700}
  #pdf .doc{padding:48px 56px;font-size:13px;line-height:1.55;color:#111}
  #pdf .dh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #15224d;padding-bottom:10px;margin-bottom:14px}
  #pdf .dh .t{font-size:22px;font-weight:700;color:#15224d}
  #pdf .dh .s{font-size:11.5px;color:#555}
  #pdf .dh .c{font-size:13px;text-align:left;color:#15224d;font-weight:700}
  #pdf .box{border:1px solid #cfd6e6;border-radius:8px;padding:8px 12px;margin:8px 0;background:#f7f9fd}
  #pdf .two{display:flex;gap:10px}
  #pdf .two>div{flex:1}
  #pdf .kv{width:100%;border-collapse:collapse;margin:6px 0}
  #pdf .kv td{border-bottom:1px solid #e3e7f0;padding:4px 6px;font-size:12.5px;vertical-align:top}
  #pdf .kv td.k{color:#555;width:26%}
  #pdf h4{margin:12px 0 3px;font-size:13.5px;color:#15224d}
  #pdf p{margin:3px 0}
  #pdf ul{margin:3px 0;padding-right:18px}
  #pdf .dayl .dayc{display:inline-block;border:1px solid #dde3ef;border-radius:5px;padding:1px 7px;margin:2px 0 2px 6px;font-size:12px}
  #pdf .sigs{display:flex;gap:16px;margin-top:16px}
  #pdf .sigs>div{flex:1;border:1px solid #cfd6e6;border-radius:8px;padding:10px 12px;font-size:12px}
  #pdf .sigs img{height:62px;display:block;margin:6px 0}
  #pdf .foot{position:absolute;bottom:22px;left:56px;right:56px;border-top:1px solid #cfd6e6;padding-top:5px;font-size:10px;color:#777;display:flex;justify-content:space-between}
  #pdf .att{padding:40px 50px}
  #pdf .att h3{margin:0 0 12px;font-size:16px;color:#15224d}
  #pdf .att img{max-width:694px;max-height:960px;display:block;margin:0 auto;border:1px solid #ddd}
</style>

<body>
<header><div class="in">
  <div class="kicker" id="kick">קליטת עובד חדש</div>
  <h1 id="hdr">הסכם עבודה וטופס 101</h1>
  <p id="sub">בחתימה דיגיטלית, מהטלפון</p>
</div></header>
<main id="app"></main>
<div class="dock hidden" id="dock"><div class="in" id="dockIn"></div></div>
<div id="toast"></div>

<!-- PDF render target (offscreen) -->
<div style="position:fixed;left:-10000px;top:0"><div id="pdf"></div></div>

<script src="vendor/html2pdf.bundle.min.js" defer></script>
<script>
"use strict";
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CPA_EMAIL = "cpa.snir@gmail.com";
const CPA_NAME = "משרד רו\"ח שניר טרמצ'י";
// כתובת ה-Web App של Google Apps Script (apps-script/Code.gs). ריק = שליחה דרך הטלפון.
const SEND_URL = "";
const DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toB64url(bytes){ let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function fromB64url(s){ s = s.replace(/[^A-Za-z0-9_\-]/g,"").replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; const bin = atob(s); const b = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i); return b; }
function b64urlEncode(obj){ return toB64url(new TextEncoder().encode(JSON.stringify(obj))); }
function b64urlDecode(s){ return JSON.parse(new TextDecoder().decode(fromB64url(s))); }
async function packLink(obj){
  const json = JSON.stringify(obj);
  if("CompressionStream" in window){
    try{
      const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
      return "#k=" + toB64url(new Uint8Array(buf));
    }catch(e){}
  }
  return "#e=" + b64urlEncode(obj);
}
async function unpackK(s){
  if(!("DecompressionStream" in window)) throw new Error("nodecomp");
  const txt = await new Response(new Blob([fromB64url(s)]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  return JSON.parse(txt);
}
function fmtDate(d){ if(!d) return ""; const [y,m,dd] = d.split("-"); return dd && m && y ? `${dd}/${m}/${y}` : d; }
function nowStamp(){ const d = new Date(); const o = {timeZone:"Asia/Jerusalem"}; return d.toLocaleDateString("en-GB",o) + " בשעה " + d.toLocaleTimeString("en-GB",Object.assign({hour:"2-digit",minute:"2-digit"},o)); }
function todayStr(){ return new Date().toLocaleDateString("he-IL",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",year:"numeric"}).replace(/\./g,"/"); }
function validId(id){
  id = String(id||"").trim(); if(!/^\d{5,9}$/.test(id)) return false;
  id = id.padStart(9,"0"); let sum = 0;
  for(let i=0;i<9;i++){ let n = Number(id[i]) * ((i%2)+1); sum += n>9 ? n-9 : n; }
  return sum % 10 === 0;
}
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 4200); }
function bad(id, msg){ const el = $("#"+id); if(el){ el.classList.add("bad"); el.scrollIntoView({behavior:"smooth",block:"center"}); el.addEventListener("input", () => el.classList.remove("bad"), {once:true}); el.addEventListener("change", () => el.classList.remove("bad"), {once:true}); } toast(msg); return false; }
function header(kick, h, sub){ $("#kick").textContent = kick; $("#hdr").textContent = h; $("#sub").textContent = sub; }
function progress(step, total, label){ return `<div class="progress"><div class="lbl"><b>${label}</b><span>שלב ${step} מתוך ${total}</span></div><div class="bar"><i style="width:${Math.round(step/total*100)}%"></i></div></div>`; }
function dock(html){ const d = $("#dock"); if(!html){ d.classList.add("hidden"); return; } $("#dockIn").innerHTML = html; d.classList.remove("hidden"); }
function radio(name, opts, val){ return `<div class="seg">${opts.map(([v,t]) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${v===val?"checked":""}>${t}</label>`).join("")}</div>`; }
const rv = name => (document.querySelector(`[name="${name}"]:checked`)||{}).value || "";
function taxYear(){ const y = T && T.start ? Number(String(T.start).slice(0,4)) : 0; const now = new Date().getFullYear(); return y && y >= now ? y : now; }

/* ================= signature pad ================= */
function sigPad(canvas){
  const ctx = canvas.getContext("2d"); let drawing = false, dirty = false, last = null, strokes = [], cur = null;
  const norm = p => { const r = canvas.getBoundingClientRect(); return [Math.round(p.x*400/r.width), Math.round(p.y*130/r.height)]; };
  function fit(){ const r = canvas.getBoundingClientRect(); const dpr = Math.max(1, window.devicePixelRatio||1);
    canvas.width = r.width*dpr; canvas.height = r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1b4a"; dirty = false; }
  fit();
  const pos = e => { const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  canvas.addEventListener("pointerdown", e => { drawing = true; last = pos(e); cur = [norm(last)]; strokes.push(cur); try{ canvas.setPointerCapture(e.pointerId); }catch(_){} });
  canvas.addEventListener("pointermove", e => { if(!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; dirty = true;
    const n = norm(p), q = cur[cur.length-1]; if(Math.abs(n[0]-q[0]) + Math.abs(n[1]-q[1]) >= 4) cur.push(n); });
  ["pointerup","pointercancel","pointerleave"].forEach(t => canvas.addEventListener(t, () => drawing = false));
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); dirty = false; strokes = []; },
    compact(){ return "s:" + strokes.filter(st => st.length).map(st => st.map(([x,y]) => x.toString(36)+"."+y.toString(36)).join(" ")).join("|"); },
    isEmpty(){ return !dirty; },
    data(){ const c = document.createElement("canvas"); c.width = 400; c.height = 130; const x = c.getContext("2d");
      x.drawImage(canvas,0,0,400,130); return c.toDataURL("image/png"); }
  };
}
function sigSrc(sig){
  if(!sig || sig.startsWith("data:")) return sig || "";
  const c = document.createElement("canvas"); c.width = 400; c.height = 130; const x = c.getContext("2d");
  x.strokeStyle = "#0b1b4a"; x.lineWidth = 2.6; x.lineCap = "round"; x.lineJoin = "round";
  sig.slice(2).split("|").forEach(st => { const pts = st.split(" ").map(p => p.split(".").map(v => parseInt(v,36)));
    x.beginPath(); pts.forEach(([a,b],i) => i ? x.lineTo(a,b) : x.moveTo(a,b)); if(pts.length===1) x.lineTo(pts[0][0]+1,pts[0][1]); x.stroke(); });
  return c.toDataURL("image/png");
}

/* ================= agreement ================= */
function wageLine(t){ return t.wageType === "monthly" ? `${esc(t.wage)} ₪ ברוטו לחודש` : `${esc(t.wage)} ₪ ברוטו לשעה`; }
function scheduleText(t){
  const rows = DAYS.map((d,i) => t.days && t.days[i] ? `<span class="dayc">יום ${d}: <b dir="ltr">${esc(t.days[i])}</b></span>` : "").join("");
  return rows ? `<p class="dayl">${rows}</p>` : "<p>לפי סידור עבודה שיימסר לעובד מראש.</p>";
}
function probationText(t){
  if(!t.probation) return "";
  const n = Number(t.probation);
  const words = {1:"החודש הראשון",2:"החודשיים הראשונים",3:"שלושת החודשים הראשונים",6:"ששת החודשים הראשונים"}[n] || `${n} החודשים הראשונים`;
  return ` ${words} להעסקה הם תקופת ניסיון.`;
}
function agreementBody(t, emp){
  const name = emp && emp.fullName ? esc(emp.fullName) : "<span style='color:#999'>(שם העובד)</span>";
  const id = emp && emp.idNum ? esc(emp.idNum) : "<span style='color:#999'>(ת\"ז)</span>";
  const addr = emp && emp.address ? esc(emp.address) : "";
  const boss = esc(t.manager || t.signer);
  const place = esc(t.workplace || t.address);
  const pension = t.pensionFund ? `בקופה: ${esc(t.pensionFund)}` : "בקופה שיבחר העובד ותימסר למעסיק בכתב, ובהיעדר בחירה – בקרן ברירת המחדל לפי הדין";
  const sev = Number(t.sevPct||6);
  const hourly = t.wageType !== "monthly";
  let n = 0; const H = title => `<h4><span class="sn">${++n}</span> ${title}</h4>`;
  return `
  <div class="parties">
    <div><small>המעסיק</small> <b>${esc(t.company)}</b>${t.companyId ? `<br>ח.פ/ע.מ ${esc(t.companyId)}` : ""}<br>${esc(t.address)}<br>(להלן: "המעסיק")</div>
    <div><small>העובד</small> <b>${name}</b><br>ת"ז ${id}${addr ? `<br>${addr}` : ""}<br>(להלן: "העובד")</div>
  </div>
  <p><b>הואיל</b> והמעסיק מעוניין להעסיק את העובד, והעובד מעוניין לעבוד אצל המעסיק, בתנאים המפורטים בהסכם זה;</p>
  <p><b>והואיל</b> והעובד מצהיר כי הוא בעל הכישורים הנדרשים לביצוע התפקיד, וכי אין כל מניעה חוקית, חוזית או אחרת להעסקתו;</p>
  <p><b>לפיכך הוסכם בין הצדדים כדלקמן:</b></p>

  ${H("מבוא ופרשנות")}
  <p>${n}.1 המבוא להסכם זה מהווה חלק בלתי נפרד ממנו. כותרות הסעיפים נועדו לנוחות בלבד.</p>
  <p>${n}.2 הסכם זה מהווה גם הודעה לעובד על תנאי עבודתו לפי חוק הודעה לעובד ולמועמד לעבודה (תנאי עבודה ומיון והליכי קבלה לעבודה), התשס"ב-2002. על יחסי העבודה יחולו, בנוסף להסכם זה, דיני העבודה וצווי ההרחבה הכלליים החלים על כלל העובדים במשק.</p>
  <p>${n}.3 האמור בהסכם בלשון זכר או נקבה – אחד הוא.</p>

  ${H("התפקיד ומקום העבודה")}
  <p>${n}.1 העובד יועסק בתפקיד <b>${esc(t.role)}</b>, וימלא את המשימות הנובעות מהתפקיד ואת ההוראות שיקבל מעת לעת מהמעסיק או מהממונה הישיר – <b>${boss}</b>.</p>
  <p>${n}.2 מקום העבודה: <b>${place}</b>, או כל מקום אחר שיקבע המעסיק בהתאם לצורכי העבודה ובמסגרת הסבירות.</p>
  <p>${n}.3 העובד יבצע את עבודתו במסירות, בנאמנות, ביושר ובמיומנות, יקפיד על נהלי המעסיק ועל כללי הבטיחות, ויודיע למעסיק ללא דיחוי על כל עניין שבו יש לו עניין אישי או שעלול להעמיד אותו בניגוד עניינים.</p>

  ${H("תקופת ההעסקה" + (t.probation ? " ותקופת ניסיון" : ""))}
  <p>${n}.1 ההעסקה תחל ביום <b>${fmtDate(t.start)}</b> והיא לתקופה בלתי קצובה, עד לסיומה בהתאם להסכם זה ולדין.</p>
  ${t.probation ? `<p>${n}.2 ${probationText(t).trim().replace(/\.$/,"")} (להלן: "תקופת הניסיון"). במהלכה יבחנו הצדדים את התאמת העובד לתפקיד, וכל צד יהיה רשאי להביא את ההעסקה לסיום בהודעה מוקדמת כקבוע בדין.</p>` : ""}

  ${H("שעות עבודה, מנוחה ושעות נוספות")}
  <p>${n}.1 היקף המשרה: <b>${esc(t.weeklyHours)}</b> שעות עבודה בשבוע. יום המנוחה השבועי: <b>${esc(t.restDay||"שבת")}</b>.</p>
  <p>${n}.2 ימי העבודה ושעותיה:</p>${scheduleText(t)}
  <p>${n}.3 העובד זכאי להפסקות לפי חוק שעות עבודה ומנוחה, התשי"א-1951. בעבודה של 6 שעות ומעלה ביום תינתן הפסקה של 45 דקות לפחות, מהן 30 דקות רצופות. ההפסקה אינה חלק משעות העבודה, אלא אם העובד נדרש להישאר במקום העבודה במהלכה.</p>
  <p>${n}.4 עבודה בשעות נוספות תיעשה <b>רק לפי דרישת המעסיק או באישורו מראש</b>. גמול שעות נוספות ישולם לפי החוק: 125% מהשכר הרגיל בעד שתי השעות הנוספות הראשונות ביום, ו-150% בעד כל שעה נוספת שלאחריהן. עבודה ביום המנוחה השבועי תיעשה רק בהיתר ותשולם בגמול לפי החוק.</p>
  ${t.globalOT ? `<p>${n}.5 גמול שעות נוספות גלובלי: בעד ${esc(t.globalOT)} שעות נוספות בחודש ישולם גמול קבוע כרכיב נפרד בתלוש השכר. רכיב זה הוא תמורה לשעות נוספות בלבד ואינו חלק מהשכר הרגיל לכל דבר ועניין; עבודה בפועל מעבר לכך תשולם לפי החוק.</p>` : ""}
  <p>${n}.${t.globalOT?6:5} העובד ידווח על שעות עבודתו באופן מלא ומדויק באמצעי רישום הנוכחות שיקבע המעסיק.</p>

  ${H("השכר")}
  <p>${n}.1 בתמורה לעבודתו ישולם לעובד ${hourly ? `<b>שכר שעתי בסך ${esc(t.wage)} ₪ ברוטו</b> לכל שעת עבודה בפועל` : `<b>שכר חודשי בסך ${esc(t.wage)} ₪ ברוטו</b> למשרה בהיקף המפורט בסעיף 4`} (להלן: "השכר").</p>
  <p>${n}.2 השכר ישולם לא יאוחר מה-9 בחודש שלאחר החודש שבעדו הוא משתלם, בהעברה לחשבון הבנק של העובד, בצירוף תלוש שכר כדין.</p>
  <p>${n}.3 מהשכר ינוכו מס הכנסה, דמי ביטוח לאומי, דמי ביטוח בריאות, חלק העובד בהפרשות לביטוח הפנסיוני וכל ניכוי אחר המותר לפי חוק הגנת השכר, התשי"ח-1958.</p>
  ${t.commission ? `<p>${n}.4 עמלות: ${esc(t.commission)}. העמלות משולמות כתוספת לשכר היסוד ואינן חלק ממנו, למעט ככל שהדין קובע אחרת.</p>` : ""}
  ${t.extras ? `<p>${n}.${t.commission?5:4} תנאים נוספים: ${esc(t.extras)}</p>` : ""}

  ${H("חופשה, מחלה, חגים והבראה")}
  <p>${n}.1 <b>חופשה שנתית</b> – לפי חוק חופשה שנתית, התשי"א-1951, בהתאם לוותק ולהיקף המשרה. מועדי החופשה יתואמו מראש עם המעסיק.</p>
  <p>${n}.2 <b>דמי מחלה</b> – לפי חוק דמי מחלה, התשל"ו-1976: צבירה של יום וחצי לכל חודש עבודה מלא, עד 90 ימים. התשלום: ללא תשלום ביום המחלה הראשון, 50% מהשכר בימים השני והשלישי, ו-100% מהיום הרביעי ואילך. היעדרות בשל מחלה תאושר בתעודה רפואית.</p>
  <p>${n}.3 <b>חגים</b> – תשלום בעד ימי חג לפי צו ההרחבה הכללי, לאחר שלושה חודשי עבודה.</p>
  <p>${n}.4 <b>דמי הבראה</b> – לפי צו ההרחבה הכללי, לאחר שנת עבודה, בהתאם לוותק ולהיקף המשרה.</p>
  <p>${n}.5 <b>נסיעות</b> – החזר הוצאות נסיעה לעבודה וממנה לפי צו ההרחבה${t.travel ? `: ${esc(t.travel)}` : ""}.</p>
  <p>${n}.6 <b>שירות מילואים</b> – זכויות העובד בתקופת שירות מילואים יהיו לפי הדין.</p>

  ${H("ביטוח פנסיוני ופיצויים")}
  <p>${n}.1 המעסיק יבטח את העובד בביטוח פנסיוני ${pension}, החל מהמועד הקבוע בצו ההרחבה לביטוח פנסיוני מקיף במשק (לרבות רטרואקטיבית ככל שהדין מחייב). שיעורי ההפרשה מהשכר המבוטח: עובד <b>${esc(t.empPct||"6")}%</b>, מעסיק לתגמולים <b>${esc(t.erPct||"6.5")}%</b>, מעסיק לפיצויים <b>${esc(t.sevPct||"6")}%</b>.</p>
  ${t.sec14 ? `<p>${n}.2 <b>סעיף 14:</b> הצדדים מסכימים כי על ההפרשות לפיצויים יחול האישור הכללי בדבר תשלומי מעביד לקרן פנסיה ולקופת ביטוח במקום פיצויי פיטורים, לפי סעיף 14 לחוק פיצויי פיטורים, התשכ"ג-1963. ההפרשות ייעשו במקום פיצויי פיטורים${sev >= 8.33 ? " במלואם (100%)" : ` בשיעור של ${esc(t.sevPct||"6")}/8.33 מהפיצויים, וההשלמה – לפי הדין`}. הכספים שנצברו ישוחררו לעובד בסיום העבודה, למעט אם נשללה זכאותו לפיצויים בפסק דין או בהסכם.</p>` : ""}
  ${t.hishEmp || t.hishEr ? `<p>${n}.${t.sec14?3:2} <b>קרן השתלמות</b> – החל מ${t.hishFrom ? esc(t.hishFrom) : "תחילת העבודה"}: הפרשות מעסיק ${esc(t.hishEr||"7.5")}% והפרשות עובד ${esc(t.hishEmp||"2.5")}% מהשכר הרגיל, בקרן שיבחר העובד.</p>` : ""}

  ${H("סודיות וקניין רוחני")}
  <p>${n}.1 העובד ישמור בסודיות מוחלטת כל מידע שיגיע אליו בקשר לעבודתו – לרבות מידע עסקי, מסחרי, כספי ואישי על המעסיק, לקוחותיו, ספקיו ועובדיו – לא יעביר אותו לאחר ולא ישתמש בו אלא לצורך ביצוע עבודתו. חובה זו חלה גם לאחר סיום ההעסקה, ואינה חלה על מידע שהוא נחלת הכלל.</p>
  <p>${n}.2 כל תוצר, מסמך, רעיון או המצאה שהעובד יצר במסגרת עבודתו ובקשר אליה – יהיו קניינו של המעסיק, בכפוף לדין.</p>

  ${H("עבודה נוספת וניגוד עניינים")}
  <p>${n}.1 במהלך תקופת העבודה לא יעבוד העובד אצל מתחרה של המעסיק ולא יעסוק בעיסוק שיש בו ניגוד עניינים עם עבודתו, אלא בהסכמת המעסיק מראש ובכתב.</p>
  <p>${n}.2 עבודה נוספת שאינה מתחרה ואינה פוגעת בעבודה – מותרת, ובלבד שהעובד יודיע עליה למעסיק מראש (גם לצורך תיאום מס).</p>

  ${H("ציוד, מערכות ופרטיות")}
  <p>${n}.1 ציוד, מסמכים, מפתחות ואמצעים שנמסרו לעובד הם רכוש המעסיק, ישמשו לצורכי העבודה בלבד, ויוחזרו במלואם ובמצב תקין בסיום העבודה או לפי דרישה.</p>
  <p>${n}.2 מערכות מחשוב ותיבות דואר שהעמיד המעסיק נועדו לצורכי עבודה. ניטור ייעשה רק בהתאם למדיניות שתימסר לעובד ובכפוף לדין, והמעסיק לא יעיין בתכנים אישיים אלא בהסכמת העובד או לפי הדין.</p>

  ${H("מניעת הטרדה מינית ופגיעה")}
  <p>${n}.1 המעסיק פועל לפי החוק למניעת הטרדה מינית, התשנ"ח-1998, ומצפה מכל עובד לשמור על סביבת עבודה מכבדת. תלונה ניתן להגיש ל${t.harassContact ? esc(t.harassContact) : `ממונה הישיר או ל${esc(t.signer)}`}. ככל שהמעסיק מחויב בתקנון – התקנון נמסר לעובד או הוצג לו.</p>

  ${H("סיום העבודה")}
  <p>${n}.1 כל צד רשאי להביא את ההעסקה לסיום בהודעה מוקדמת בכתב, כקבוע בחוק הודעה מוקדמת לפיטורים ולהתפטרות, התשס"א-2001. המעסיק רשאי לוותר על עבודת העובד בתקופת ההודעה המוקדמת ולשלם לו תמורתה.</p>
  <p>${n}.2 פיטורים ייעשו לאחר שימוע כדין.</p>
  <p>${n}.3 בסיום העבודה יחזיר העובד את כל רכוש המעסיק, וישולמו לו כל הזכויות המגיעות לו לפי הדין והסכם זה, בצירוף תלוש גמר חשבון, טופס 161 (במקרה של פרישה) ומכתב שחרור לקופה.</p>

  ${H("הצהרות העובד")}
  <p>${n}.1 העובד מצהיר כי הפרטים שמסר נכונים ומלאים, כי אינו כבול בהתחייבות המונעת ממנו לעבוד אצל המעסיק, ויודיע למעסיק בתוך 7 ימים על כל שינוי בפרטיו (כתובת, מצב משפחתי, חשבון בנק, עבודה נוספת).</p>

  ${H("כללי")}
  <p>${n}.1 הסכם זה ממצה את תנאי ההעסקה בין הצדדים. כל שינוי בו ייעשה בכתב, ויימסר לעובד כדין.</p>
  <p>${n}.2 אין בהסכם זה כדי לגרוע מזכות המוקנית לעובד לפי דין, צו הרחבה או הסכם קיבוצי החל עליו. במקרה של סתירה – תחול ההוראה המיטיבה עם העובד.</p>
  <p>${n}.3 העובד מאשר כי קרא את ההסכם, הבין אותו, קיבל הזדמנות לשאול שאלות, והוא מסכים לתנאיו. חתימה אלקטרונית על הסכם זה כמוה כחתימה בכתב יד.</p>
  <p style="margin-top:10px"><b>ולראיה באו הצדדים על החתום.</b></p>`;
}
function termsGrid(t){
  return `<div class="terms">
    <div><small>תפקיד</small><b>${esc(t.role)}</b></div>
    <div><small>תחילת עבודה</small><b>${fmtDate(t.start)}</b></div>
    <div><small>שכר</small><b>${wageLine(t)}</b></div>
    <div><small>היקף</small><b>${esc(t.weeklyHours)} שעות בשבוע</b></div>
  </div>`;
}

/* ================= employer setup ================= */
let PRESET = null;
function renderSetup(){
  header("למעסיק", "הכנת הסכם עבודה לעובד חדש", "ממלאים תנאים, חותמים, ושולחים לעובד קישור אישי");
  dock(`<button class="btn wide" type="button" id="makeLink">צור קישור לעובד ←</button>`);
  const saved = Object.assign({}, store.get("employer") || {}, PRESET || {});
  const dayRows = DAYS.map((d,i) => `<b>${d}</b><input data-day="${i}" placeholder="למשל 09:00-17:00 · ריק = לא עובד">`).join("");
  $("#app").innerHTML = `
  <div class="card">
    <h2><span class="n">1</span>איך זה עובד</h2>
    <ul class="list">
      <li><span>✍️</span><div>ממלאים את תנאי ההעסקה של העובד הזה וחותמים.</div></li>
      <li><span>🔗</span><div>נוצר קישור אישי לעובד – שולחים לו בוואטסאפ.</div></li>
      <li><span>📄</span><div>העובד ממלא פרטים, חותם על ההסכם וממלא טופס 101 עם הסברים.</div></li>
      <li><span>📬</span><div>בסוף נוצר PDF חתום (הסכם + 101 רשמי + צילום ת"ז) שנשלח אליך ולמשרד רו"ח.</div></li>
    </ul>
    <p class="note">לכל עובד – קישור נפרד עם ההסכם שלו. פרטי העסק נשמרים במכשיר הזה כדי שלא תצטרך להקליד שוב.</p>
  </div>

  <div class="card">
    <h2><span class="n">2</span>פרטי העסק</h2>
    <div class="row">
      <div><label class="req">שם החברה / העסק</label><input id="company" value="${esc(saved.company||"")}"></div>
      <div><label>ח.פ / ע.מ</label><input id="companyId" inputmode="numeric" value="${esc(saved.companyId||"")}"></div>
    </div>
    <div class="row">
      <div><label>מספר תיק ניכויים</label><input id="deductions" inputmode="numeric" maxlength="9" value="${esc(saved.deductions||"")}" placeholder="9 ספרות, מתחיל ב-9"></div>
      <div><label>טלפון העסק</label><input id="ephone" inputmode="tel" value="${esc(saved.ephone||"")}"></div>
    </div>
    <label class="req">כתובת העסק</label><input id="address" value="${esc(saved.address||"")}">
    <div class="row">
      <div><label class="req">שם החותם מטעם המעסיק</label><input id="signer" value="${esc(saved.signer||"")}"></div>
      <div><label>ממונה ישיר (אם אחר)</label><input id="manager"></div>
    </div>
    <label class="req">המייל שלך – לכאן יגיעו המסמכים החתומים</label><input id="ownerEmail" type="email" inputmode="email" value="${esc(saved.ownerEmail||"")}" placeholder="name@example.com">
    <p class="note">עותק נשלח גם ל${CPA_NAME} (${CPA_EMAIL}).</p>
    <label>איש קשר לתלונות על הטרדה מינית</label><input id="harassContact" value="${esc(saved.harassContact||"")}" placeholder="שם ותפקיד">
  </div>

  <div class="card">
    <h2><span class="n">3</span>העובד</h2>
    <div class="row">
      <div><label class="req">שם העובד</label><input id="empName" placeholder="שם פרטי ומשפחה"></div>
      <div><label>הנייד של העובד</label><input id="empPhone" inputmode="tel" placeholder="לשליחה ישירה בוואטסאפ"></div>
    </div>
    <p class="note">כך תדע/י לאיזה עובד שייך כל קישור. השם יופיע גם אצל העובד כשהוא פותח את הקישור.</p>
  </div>

  <div class="card">
    <h2><span class="n">4</span>תפקיד ושעות</h2>
    <div class="row">
      <div><label class="req">תפקיד</label><input id="role" placeholder="למשל: עובד/ת דלפק"></div>
      <div><label class="req">תאריך תחילת עבודה</label><input id="start" type="date"></div>
    </div>
    <h3>ימים ושעות</h3>
    <div class="days">${dayRows}</div>
    <div class="btns"><button class="btn sec" type="button" id="fillWeek">א׳–ה׳ 09:00-17:00</button><button class="btn sec" type="button" id="clearWeek">נקה</button></div>
    <div class="row">
      <div><label class="req">היקף שעות שבועי</label><input id="weeklyHours" inputmode="decimal"></div>

function waHref(phone, name, company, url){
  let p = String(phone||"").replace(/\D/g,""); if(p.startsWith("0")) p = "972" + p.slice(1);
  const msg = `היי ${name || ""}! 👋 שמחים שאת/ה מצטרף/ת ל${company}.\nבקישור ממלאים פרטים, חותמים על הסכם העבודה וממלאים טופס 101 – הכל מהטלפון, כ-10 דקות:\n${url}`;
  return "https://wa.me/" + (p.length >= 11 ? p : "") + "?text=" + encodeURIComponent(msg);
}
function drawHist(){
  const box = $("#histCard"); if(!box) return; const hist = store.get("links") || [];
  if(!hist.length){ box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  box.innerHTML = `<h2>📋 קישורים ששלחת</h2><p class="note">נשמר רק במכשיר הזה.</p>` + hist.map((x,i) => `<div class="filechip"><span><b>${esc(x.name)}</b> · ${esc(x.role||"")}<br><small class="note">נוצר ${new Date(x.at).toLocaleDateString("he-IL")} · מתחיל/ה ${fmtDate(x.start)}</small></span><span style="display:flex;gap:6px"><a class="btn sec" style="padding:8px 10px" target="_blank" rel="noopener" href="${esc(waHref(x.phone, x.name, (store.get("employer")||{}).company||"", x.url))}">וואטסאפ</a><button type="button" class="btn sec" style="padding:8px 10px;color:#c62828" data-hdel="${i}">מחק</button></span></div>`).join("");
  $$("[data-hdel]", box).forEach(b => b.onclick = () => { const h = store.get("links") || []; h.splice(Number(b.dataset.hdel),1); store.set("links", h); drawHist(); });
}

let BANKS = null;
fetch("vendor/banks.json").then(r => r.ok ? r.json() : null).then(j => { BANKS = j; }).catch(() => {});
function bankName(code){ const b = BANKS && BANKS.banks.find(b => String(b.code) === String(code)); return b ? b.name : ""; }
function branchName(bc, br){ const b = BANKS && BANKS.banks.find(b => String(b.code) === String(bc)); const s = b && b.branches.find(s => String(s.code) === String(br)); return s ? s.name : ""; }
function bankFields(){
  const box = $("#bankBox");
  if(!BANKS){
    box.innerHTML = `<div class="row"><div><label class="req">מספר בנק</label><input id="bank" inputmode="numeric" placeholder="למשל 12"></div><div><label class="req">מספר סניף</label><input id="branch" inputmode="numeric"></div></div><p class="note">את מספר הבנק והסניף אפשר לראות בצ'ק או באפליקציה של הבנק.</p>`;

  }
  box.innerHTML = `<label class="req">בנק</label><select id="bank"><option value="">בחר/י בנק</option>${BANKS.banks.map(b => `<option value="${b.code}">${esc(b.name)} (${b.code})</option>`).join("")}</select>
    <label class="req">סניף</label><select id="branch" disabled><option value="">קודם בוחרים בנק</option></select>

  const fill = () => { const b = BANKS.banks.find(b => String(b.code) === $("#bank").value); const s = $("#branch");

    s.disabled = false; s.innerHTML = `<option value="">בחר/י סניף</option>` + b.branches.map(x => `<option value="${x.code}">${x.code} – ${esc(x.name)}${x.city ? ", " + esc(x.city) : ""}</option>`).join(""); };

function collect101(){
  const val = id => ($("#"+id)||{}).value || "";
  F = Object.assign(F, {
    marital:rv("marital"), israeli:rv("israeli"), kibbutz:val("kibbutz"), hmo:val("hmo"), aliyah:val("aliyah"),
    hasKids:rv("hasKids"), kids: rv("hasKids")==="yes" ? readKids() : [],
    incType:val("incType"), incStart:val("incStart"),
    otherInc:rv("otherInc"), oi:$$("[data-oi]").filter(e=>e.checked).map(e=>e.dataset.oi), credHere:rv("credHere"),
    noHish:($("#noHish")||{}).checked, noPens:($("#noPens")||{}).checked,
    spFirst:val("spFirst"), spLast:val("spLast"), spId:val("spId"), spBirth:val("spBirth"), spInc:rv("spInc"),
    credits:$$("[data-cr]").filter(e=>e.checked).map(e=>e.dataset.cr),
    c3town:val("c3town"), c3from:val("c3from"), c4from:val("c4from"), c4noinc:val("c4noinc"), c11n:val("c11n"), c14s:val("c14s"), c14e:val("c14e"), c16d:val("c16d"),
    coord:rv("coord"), co:[0,1,2].map(i => ({n:val(`co${i}n`),a:val(`co${i}a`),d:val(`co${i}d`),t:val(`co${i}t`),m:val(`co${i}m`),x:val(`co${i}x`)})).filter(c => c.n)
  });
}

function renderAttach(){
  window.scrollTo(0,0);
  header(T.company, "צילומים ואישורים", "כמעט סיימנו");
  dock(`<button class="btn sec" type="button" id="back">→ חזרה</button><button class="btn" type="button" id="next" style="flex:2">צור מסמך חתום ←</button>`);
  const needs = [];
  if(F.marital === "פרוד/ה") needs.push("אישור פקיד שומה על פירוד");
  const map = {c2a:"אישור נכות/עיוורון",c2b:"אישור תגמול חודשי",c3:"אישור תושב מהרשות (1312א)",c4:"תעודת עולה",c11:"אישור גמלת ילד נכה",c12:"פסק דין למזונות",c14:"תעודת שחרור / סיום שירות",c15:"טופס 119",c16:"אישור צה\"ל על שירות מילואים כלוחם"};
  (F.credits||[]).forEach(k => map[k] && needs.push(map[k]));
  if(F.coord === "approved") needs.push("אישור תיאום מס מפקיד השומה");
  $("#app").innerHTML = progress(4, TOTAL, "צילומים") + `
  <div class="card">
    <h2>🪪 צילום תעודת זהות עם ספח</h2>
    <div class="help">צלם/י את הת"ז ואת הספח הפתוח (שבו מופיעים הילדים והכתובת). צילום ברור, בלי השתקפות.</div>
    <label class="btn sec wide" style="margin:8px 0"><input type="file" accept="image/*" capture="environment" multiple data-kind="id" class="hidden">📷 צלם/י או בחר/י תמונה</label>
    <div id="idList"></div>
  </div>
  <div class="card">
    <h2>📎 אישורים</h2>
    ${needs.length ? `<div class="help">לפי מה שסימנת צריך לצרף: <b>${needs.map(esc).join(" · ")}</b></div>` : `<p class="note">לא סימנת הקלות שדורשות אישור. אפשר לדלג.</p>`}
    <label class="btn sec wide" style="margin:8px 0"><input type="file" accept="image/*" multiple data-kind="doc" class="hidden">📎 הוסף אישור</label>
    <div id="docList"></div>
  </div>
  <div class="card">
    <h2>✅ הצהרה</h2>
    <label class="opt"><input type="checkbox" id="decl"><span class="t">אני מצהיר/ה כי הפרטים שמסרתי בטופס זה מלאים ונכונים. ידוע לי שהשמטה או מסירת פרטים לא נכונים הן עבירה על פקודת מס הכנסה. אני מתחייב/ת להודיע למעסיק על כל שינוי בפרטים בתוך שבוע.</span></label>
  </div>`;
  const draw = () => { for(const kind of ["id","doc"]){ $("#"+kind+"List").innerHTML = ATT.map((a,i) => a.kind===kind ? `<div class="filechip"><span>🖼️ ${esc(a.name)}</span><button type="button" data-rm="${i}">הסר</button></div>` : "").join(""); }
    $$("[data-rm]").forEach(b => b.onclick = () => { ATT.splice(Number(b.dataset.rm),1); draw(); }); };
  $$("input[type=file]").forEach(inp => inp.onchange = async e => {
    for(const f of e.target.files){ try{ ATT.push({kind:inp.dataset.kind, name:f.name || "צילום", src: await shrink(f)}); }catch(_){ toast("לא הצלחתי לקרוא את הקובץ " + f.name); } }
    inp.value = ""; draw();
  });
  draw();
  $("#back").onclick = render101;

/* html2canvas loses spaces / misplaces punctuation in Hebrew. Wrap every word in an inline-block span. */
function prepRTL(root){
  const heb = /[֐-׿]/;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(tn => {
    const t = tn.nodeValue; if(!t.trim()) return;
    const parent = tn.parentNode; if(!parent || parent.closest(".noprep")) return;
    const frag = document.createDocumentFragment();
    t.split(/(\s+)/).forEach(part => {
      if(!part) return;
      if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(" ")); return; }
      const sp = document.createElement("span"); sp.style.display = "inline-block";
      if(heb.test(part)) sp.textContent = "\u200F" + part + "\u200F"; else { sp.textContent = "\u200E" + part + "\u200E"; }
      frag.appendChild(sp);
    });
    parent.replaceChild(frag, tn);
  });
}

    else if(h.startsWith("#e=")) T = b64urlDecode(decodeURIComponent(h.slice(3)));
  }catch(e){
    $("#app").innerHTML = `<div class="card warn">${e && e.message === "nodecomp" ? "הדפדפן בטלפון הזה ישן מדי לפתיחת הקישור. עדכן/י את Chrome או Safari ונסה/י שוב." : "הקישור פגום או חלקי. בקש/י מהמעסיק לשלוח אותו שוב."}</div>`; return;
  }
  if(T){ renderWelcome(); return; }
  if(h.startsWith("#s=")){ try{ PRESET = b64urlDecode(h.slice(3)); }catch(e){ PRESET = null; } }
  renderSetup();
}
route();
</script>
